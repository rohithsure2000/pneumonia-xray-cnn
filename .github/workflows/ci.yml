name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with flake8
        run: flake8 src tests --max-line-length=100 --extend-ignore=E203

      - name: Check formatting with black (advisory)
        # Non-blocking: flags style drift for a human to look at without
        # failing the build over it. Formatter output can legitimately shift
        # between Black releases, so gating CI on exact byte-for-byte
        # agreement is more brittle than it's worth here.
        continue-on-error: true
        run: black --check --diff src tests

      - name: Run tests
        run: pytest --cov=pneumonia_cnn --cov-report=term-missing
